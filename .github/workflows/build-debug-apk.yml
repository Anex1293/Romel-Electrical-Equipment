name: Build Debug APK & Publish Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare debug keystore and environment config
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK for release
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk romel-catalog-debug.apk

      - name: Upload Debug APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: romel-catalog-debug-apk
          path: romel-catalog-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-build.${{ github.run_number }}
          name: ROMEL Catalog Debug APK (Build #${{ github.run_number }})
          body: |
            Automated Debug APK build for **ROMEL Electrical Equipment Catalog & Inventory** (`com.aistudio.romelcatalog.rml25k`).
            - Direct APK asset: `romel-catalog-debug.apk`
            - Commit: `${{ github.sha }}`
          files: romel-catalog-debug.apk
          make_latest: true
          generate_release_notes: true
